{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="navigation-overflow" title="Menu">
          <svg class="menu-monogram" viewBox="0 0 32 36" width="28" height="32" aria-hidden="true" focusable="false">
            <rect class="menu-monogram__spine" x="2" y="2" width="7" height="32" />
            <path class="menu-monogram__top" d="M12 2h8a7 7 0 0 1 0 14h-8Z" />
            <path class="menu-monogram__bottom" d="M12 19h10a7.5 7.5 0 0 1 0 15H12Z" />
          </svg>
          <span class="menu-close" aria-hidden="true">×</span>
        </button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul id="navigation-overflow" class="hidden-links hidden"></ul>
      </nav>
      <button id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
        <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>
